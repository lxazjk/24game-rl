model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
output_dir: outputs/grpo-qwen-24

data:
  train_path: data/train.jsonl
  eval_path: data/eval.jsonl
  negative_path: data/negative.jsonl

training:
  learning_rate: 0.000001
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  num_train_epochs: 3
  logging_steps: 5
  logging_dir: outputs/grpo-qwen-24/logs
  save_strategy: "no"
  eval_strategy: steps
  eval_steps: 100
  max_completion_length: 256
  num_generations: 4
  beta: 0.04
  temperature: 0.8
  report_to: none

generation:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.95
