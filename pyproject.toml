[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twenty-four-rl"
version = "0.1.0"
description = "GRPO/RLVR pipeline for solving the 24 game with Qwen2.5."
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.34.0",
  "datasets>=5.0.0,<6.0.0",
  "fsspec[http]>=2024.6.0,<=2026.4.0",
  "huggingface-hub>=1.5.0,<2.0.0",
  "peft>=0.12.0",
  "pyyaml>=6.0.1",
  "torch>=2.1.0",
  "transformers>=4.56.2,<6.0.0",
  "trl>=1.4.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
