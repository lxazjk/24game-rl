model_name_or_path: outputs/grpo-qwen-24-correctness-heavy-step50/checkpoint-final
output_dir: outputs/grpo-qwen-countdown-from-24
reward_set: shaped

data:
  train_path: data/countdown_train.jsonl
  eval_path: data/countdown_eval.jsonl

training:
  learning_rate: 0.0000005
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  logging_steps: 10
  save_strategy: steps
  save_steps: 50
  save_total_limit: 3
  eval_strategy: steps
  eval_steps: 50
  max_completion_length: 128
  num_generations: 16
  beta: 0.02
  temperature: 1.0
  report_to: none

generation:
  max_new_tokens: 128
  temperature: 0.9
  top_p: 0.95
